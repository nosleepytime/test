name: Build ChaiUpdateBlocker V3 dylib
on:
  push:
    branches:
      - chai-update-blocker-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Compile and ad-hoc sign for iOS arm64
        run: bash build_on_mac.sh
      - name: Verify dylib
        run: |
          file ChaiUpdateBlockerV3.dylib
          lipo -info ChaiUpdateBlockerV3.dylib
          otool -hv ChaiUpdateBlockerV3.dylib
          codesign --verify ChaiUpdateBlockerV3.dylib
      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: ChaiUpdateBlockerV3-ios-arm64
          path: ChaiUpdateBlockerV3.dylib
          if-no-files-found: error
          retention-days: 30
